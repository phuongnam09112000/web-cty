map $arg_lang $istt_render_lang {
    default vi;
    en en;
}

server {
    listen 80;
    server_name _;
    root /var/www/webct;
    index index.html;
    client_max_body_size 1m;

    location /api/public/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /media/ {
        alias /var/lib/istt/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ ^/media/(.*/)?\. {
            return 404;
        }
    }

    location = /index.html {
        rewrite ^ / last;
    }

    location / {
        try_files $uri @render;
    }

    location @render {
        if ($uri !~ "^/[A-Za-z0-9/_.-]*$") {
            rewrite ^ /index.html break;
        }
        proxy_pass http://127.0.0.1:4000/api/public/render?path=$uri&lang=$istt_render_lang;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_index;
    }

    location @static_index {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 8080;
    server_name _;
    root /var/www/istt-admin;
    index index.html;
    client_max_body_size 1m;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    location /api/admin/ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Gateway THAY_BANG_ADMIN_GATEWAY_SECRET;
    }

    location ^~ /media/ {
        alias /var/lib/istt/media/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        location ~ ^/media/(.*/)?\. {
            return 404;
        }
    }

    location / {
        try_files $uri /index.html;
    }
}
