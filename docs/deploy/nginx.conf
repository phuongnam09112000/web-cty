server {
    listen 80;
    server_name _;
    root /var/www/webct;
    index index.html;
    client_max_body_size 1m;

    location /api/public/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8080;
    server_name _;
    root /var/www/istt-admin;
    index index.html;
    client_max_body_size 1m;

    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;

    location /api/admin/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Gateway THAY_BANG_ADMIN_GATEWAY_SECRET;
    }

    location / {
        try_files $uri /index.html;
    }
}
